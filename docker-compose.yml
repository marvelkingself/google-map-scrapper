# Coolify deployment. Differs from docker-compose.yml in one way that matters:
# locally the 127.0.0.1 port binding IS the security boundary. On a public server it's gone,
# so the scraper publishes NO ports and only Caddy (which demands a password) gets the domain.
# Never give a domain to the google-maps-scraper service itself — the image has no auth.

services:
  google-maps-scraper:
    image: gosom/google-maps-scraper:latest
    command: ["-web", "-data-folder", "/gmapsdata"]
    restart: unless-stopped
    expose:
      - "8080"                 # internal network only — no domain, no published port
    shm_size: "1gb"            # Chromium crashes on the default 64MB /dev/shm
    volumes:
      - gmaps_data:/gmapsdata
      - gmaps_cache:/opt

  # MCP endpoint so agent platforms (Paperclip etc.) can use the scraper as a tool.
  mcp:
    build: .                 # files are copied into the image; a repo bind mount does not exist on the host
    restart: unless-stopped
    environment:
      - SCRAPER_BASE_URL=http://google-maps-scraper:8080   # internal, no password needed
      - MCP_TOKEN=${MCP_TOKEN:?set MCP_TOKEN in Coolify (any long random string)}
      - SCRAPER_OUT_DIR=/tmp                               # remote callers get the rows inline, not a file
      # Bulk scraping without proxies gets a VPS IP blocked fast. Set this in Coolify when you have them
      # (space- or comma-separated): http://user:pass@ip:port socks5://ip:port
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-}
      - SCRAPER_MAX_PARALLEL=${SCRAPER_MAX_PARALLEL:-1}    # raise above 1 only with proxies
    expose:
      - "8081"
    depends_on:
      - google-maps-scraper

  auth:
    build:
      context: .
      dockerfile: Dockerfile.caddy   # Caddyfile is baked in, not mounted
    restart: unless-stopped
    # Caddy hashes the password itself at startup. A bcrypt hash is full of "$" signs and docker
    # compose eats those when they come from an env file, so only the plain password travels in env.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export AUTH_HASH="$$(caddy hash-password --plaintext "$$AUTH_PASS")"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    # Routing is assigned in the Coolify UI, per service: give a domain to THIS service only and
    # leave google-maps-scraper and mcp blank. Coolify writes the traefik labels from that field;
    # labels written here cannot reference a variable, because Coolify escapes ${VAR} to $${VAR}.
    # A domain on google-maps-scraper would publish the scraper with no password at all.
    environment:
      - AUTH_USER=${AUTH_USER:-marketing}
      - AUTH_PASS=${AUTH_PASS:?set AUTH_PASS in Coolify (plain password, avoid the $ character)}
    expose:
      - "80"
      - "8080"
    volumes:
      - caddy_data:/data
    depends_on:
      - google-maps-scraper
      - mcp

volumes:
  gmaps_data:
  gmaps_cache:
  caddy_data:
